<!-- Mobile Backdrop -->
<div class="sidebar-backdrop" [class.mobile-open]="mobileOpen" (click)="closeMobile.emit()"></div>

<!-- Left Sidebar -->
<aside class="sidebar" [class.mobile-open]="mobileOpen">
  <!-- Brand Header -->
  <a class="brand" (click)="onSelect('overview')" title="Về trang tổng quan">
    <div class="brand-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-title">GradHub</span>
      <span class="brand-subtitle">KHOA CÔNG NGHỆ THÔNG TIN</span>
    </div>
  </a>

  <!-- Navigation Items -->
  <nav class="nav-content">
    <div class="nav-section-title">QUẢN LÝ ĐỒ ÁN</div>

    <button
      type="button"
      class="nav-item"
      [class.active]="page === 'overview'"
      (click)="onSelect('overview')"
      id="nav-overview">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Tổng quan</span>
    </button>

    <button
      type="button"
      class="nav-item"
      [class.active]="page === 'students'"
      (click)="onSelect('students')"
      id="nav-students">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Sinh viên</span>
    </button>

    <button
      type="button"
      class="nav-item"
      [class.active]="page === 'topics'"
      (click)="onSelect('topics')"
      id="nav-topics">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        <line x1="9" y1="7" x2="15" y2="7"/>
        <line x1="9" y1="11" x2="15" y2="11"/>
      </svg>
      <span>Đề tài nghiên cứu</span>
    </button>

    <button
      type="button"
      class="nav-item"
      [class.active]="page === 'registrations'"
      (click)="onSelect('registrations')"
      id="nav-registrations">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <span>Đăng ký đề tài</span>
    </button>
  </nav>

  <!-- System Info Widget -->
  <div class="sidebar-footer">
    <div class="system-status">
      <span class="pulse-dot pulse-dot-emerald"></span>
      <span>Hệ thống trực tuyến</span>
    </div>
    <span class="system-desc">Microservices API · v1.0</span>
  </div>
</aside>
